<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#143f34"><title>Balance Ball | Salone Edition</title><style>*{box-sizing:border-box}body{margin:0;background:#102d28;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000;background:#153c3488;padding:9px;border-radius:10px;font-size:clamp(12px,2.5vw,17px)}#panel{position:fixed;inset:0;display:grid;place-items:center;background:#071d18a8;padding:20px}#panel.hidden{display:none}.sheet{background:#164a3e;border:2px solid #f5ce73;border-radius:20px;padding:25px;max-width:420px;text-align:center;box-shadow:0 15px 40px #0008}h1{font-size:clamp(30px,7vw,48px);margin:0;color:#ffd67b}p{line-height:1.5}button{border:0;border-radius:12px;background:#f9c852;color:#16372e;font-weight:900;padding:14px 24px;font-size:18px;cursor:pointer}#controls{position:fixed;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}#pad{width:140px;height:140px;border:3px solid #fff7;border-radius:50%;background:#fff2;position:relative;pointer-events:auto;touch-action:none}#nub{position:absolute;width:52px;height:52px;left:41px;top:41px;background:#ffe2a0a8;border-radius:50%;border:2px solid #fff8}#dodge{align-self:end;pointer-events:auto;border-radius:50%;width:94px;height:94px;padding:0;font-size:15px;touch-action:none}@media(hover:hover) and (pointer:fine){#controls{opacity:.45}}</style><canvas id="game"></canvas><div id="hud"><span id="team">TEAM A · 3 LEFT</span><span id="score">SURVIVAL 0.0s</span><span id="round">ROUND 1</span></div><div id="controls"><div id="pad"><div id="nub"></div></div><button id="dodge">DODGE</button></div><div id="panel"><div class="sheet"><h1>BALANCE BALL</h1><h2>🇸🇱 SALONE EDITION</h2><p>One ball. Two throwers. Three teammates.<br>Stay in the middle and dodge the ball. When you're hit, the next teammate steps in!</p><p><small>WASD / arrow keys or touch joystick · Space / DODGE for a quick dash</small></p><button id="start">PLAY NOW</button><p><small>Prototype v0.2 · Team Survival</small></p></div></div><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);let state='menu',team=0,players=3,elapsed=0,total=0,round=1,ball=null,thrower=0,cool=1.1,inv=0,dash=0,last=performance.now(),keys={},stick={x:0,y:0},p={x:0,y:0};
function bounds(){let w=Math.min(W*.76,760),h=Math.min(H*.68,520);return{x:(W-w)/2,y:(H-h)/2+12,w,h}}function resetPlayer(){p.x=W/2;p.y=H/2;inv=.9;dash=0;ball=null;cool=1.1}function start(){state='play';team=0;players=3;round=1;total=0;elapsed=0;resetPlayer();$('panel').classList.add('hidden')}function gameOver(){state='between';$('panel').classList.remove('hidden');$('panel').querySelector('h1').textContent='TEAM ELIMINATED';$('panel').querySelector('h2').textContent='SURVIVED '+total.toFixed(1)+' SECONDS';$('panel').querySelector('p').innerHTML='All three players are out. Next team steps into the middle!';$('start').textContent='NEXT TEAM';$('start').onclick=()=>{team++;round++;players=3;elapsed=0;total=0;resetPlayer();state='play';$('panel').classList.add('hidden')}}$('start').onclick=start;
function dodge(){if(state==='play'&&dash<=0){dash=.27;inv=Math.max(inv,.27)}}$('dodge').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();dodge()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const pad=$('pad'),nub=$('nub');function padMove(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y)||1,s=Math.min(1,58/l);stick.x=x/l*Math.min(l/58,1);stick.y=y/l*Math.min(l/58,1);nub.style.transform=`translate(${x*s}px,${y*s}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padMove(e)});function release(){stick.x=stick.y=0;nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function person(x,y,color,scale=1){ellipse(x+4,y+14*scale,14*scale,5*scale,'#0003');ctx.fillStyle=color;ctx.fillRect(x-9*scale,y-9*scale,18*scale,22*scale);ellipse(x,y-15*scale,9*scale,10*scale,'#7c4a2b');ellipse(x,y-21*scale,9*scale,4*scale,'#24170f');ctx.fillStyle='#2a2521';ctx.fillRect(x-8*scale,y+12*scale,6*scale,10*scale);ctx.fillRect(x+3*scale,y+12*scale,6*scale,10*scale)}function draw(){let b=bounds();ctx.fillStyle='#89c8e5';ctx.fillRect(0,0,W,H);ctx.fillStyle='#edb97e';ctx.fillRect(0,H*.25,W,H*.75);let houses=['#e28c6f','#f3c16c','#6bada5','#e4a1b2','#d79d68','#8eb9cc'];for(let i=0;i<7;i++){let x=i*W/6-W/15,w=W/5,h=H*.20+(i%3)*H*.025;ctx.fillStyle=houses[i%6];ctx.fillRect(x,H*.25-h,w,h);ctx.fillStyle='#443e37';for(let j=0;j<3;j++)ctx.fillRect(x+15+j*w/3,H*.25-h+15,Math.max(10,w/7),h*.20);ctx.fillStyle='#77553e';ctx.fillRect(x,H*.25-4,w,6)}ctx.fillStyle='#b98c60';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.setLineDash([10,9]);ctx.beginPath();ctx.moveTo(W/2,b.y);ctx.lineTo(W/2,b.y+b.h);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffffff16';ctx.fillRect(b.x+15,b.y+15,b.w-30,b.h-30);person(b.x-22,H/2,'#a63636',1.15);person(b.x+b.w+22,H/2,'#a63636',1.15);for(let i=0;i<3;i++){ellipse(b.x+50+i*28,b.y+b.h+23,9,4,'#0003');ellipse(b.x+50+i*28,b.y+b.h+12,8,8,i<players?'#28966a':'#777')}if(inv<=0||Math.floor(performance.now()/100)%2===0)person(p.x,p.y,'#178b65',1.15);if(ball){ellipse(ball.x+4,ball.y+10,ball.r,ball.r*.45,'#0003');ellipse(ball.x,ball.y,ball.r,ball.r,'#f3e4b6');ctx.strokeStyle='#ad633c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*.65,0,Math.PI*1.4);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('DODGE ZONE',W/2,b.y+20)}
function update(dt){if(state!=='play')return;let b=bounds();elapsed+=dt;total+=dt;inv=Math.max(0,inv-dt);dash=Math.max(0,dash-dt);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stick.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+stick.y,l=Math.hypot(x,y)||1,speed=(dash>0?510:240)*dt;p.x=Math.max(b.x+20,Math.min(b.x+b.w-20,p.x+x/l*speed));p.y=Math.max(b.y+30,Math.min(b.y+b.h-30,p.y+y/l*speed));cool-=dt;if(!ball&&cool<=0){let sx=thrower?b.x+b.w+20:b.x-20,sy=H/2;let dx=p.x-sx,dy=p.y-sy,dist=Math.hypot(dx,dy)||1,v=290+Math.min(170,elapsed*5);ball={x:sx,y:sy,vx:dx/dist*v,vy:dy/dist*v,r:11};thrower=1-thrower;cool=1.1}if(ball){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(inv<=0&&Math.hypot(ball.x-p.x,ball.y-(p.y-3))<ball.r+13){players--;resetPlayer();if(players<=0){gameOver()}}else if(ball.x<b.x-65||ball.x>b.x+b.w+65||ball.y<b.y-40||ball.y>b.y+b.h+40){ball=null;cool=.4}}$('team').textContent='TEAM '+String.fromCharCode(65+team%26)+' · '+players+' LEFT';$('score').textContent='SURVIVAL '+total.toFixed(1)+'s';$('round').textContent='ROUND '+round}
function frame(t){let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}resetPlayer();requestAnimationFrame(frame);
</script></html>
